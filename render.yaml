services:
  # Backend API (Node.js + Express)
  - type: web
    name: healthcare-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app  # UPDATE THIS
      - key: SLOT_HOLD_TTL_MINUTES
        value: 5
      - key: MAX_NOTIFICATION_RETRIES
        value: 3
      # Optional — add your own keys:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: SMTP_HOST
      #   value: smtp.sendgrid.net
      # - key: SMTP_PASS
      #   sync: false
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false

databases:
  # Free PostgreSQL on Render (90 days retention on free tier)
  - name: healthcare-db
    databaseName: healthcare_db
    user: healthcare_user
    plan: free
